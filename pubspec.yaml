name: educenter
description: Educational Center app (WebView shell + push notifications)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  connectivity_plus: ^6.1.0
  permission_handler: ^11.3.1
  flutter_ringtone_player: ^4.0.0+2
  shared_preferences: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/index.html
